<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pre Test dan Post Test - Simple Past Tense</title><style>
:root{--g:#174b3b;--bg:#f3f6f4;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17221e;font:16px/1.5 Arial,sans-serif}header{background:linear-gradient(135deg,#123b30,#28664f);color:white;padding:25px 16px}.wrap{max-width:900px;margin:auto;padding:0 14px}h1{margin:0;font-size:clamp(25px,5vw,36px)}header p{margin:6px 0}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;margin:18px 0}h2{margin:0 0 14px;color:var(--g)}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-weight:bold;font-size:14px}input[type=text],input[type=date]{display:block;width:100%;padding:12px;border:1px solid #bdcbc2;border-radius:9px;font-size:16px;margin-top:5px}.q{border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0}.q legend{font-weight:bold}.options{display:grid;gap:8px;margin-top:10px}.option{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #e0e7e2;border-radius:9px;font-weight:normal;cursor:pointer}.option input{margin-top:5px;accent-color:var(--g)}button{border:0;border-radius:9px;padding:12px 15px;font-size:15px;font-weight:bold;cursor:pointer}.primary{background:var(--g);color:white}.secondary{background:#e7efe9;color:var(--g)}.danger{background:#fff0ed;color:#963b2b}.actions{display:flex;gap:10px;flex-wrap:wrap}.note{font-size:14px;color:#63716b}.result{display:none;background:#eaf4ef;padding:16px;border-radius:10px;margin-top:15px}.score{font-size:34px;font-weight:bold;color:var(--g)}footer{text-align:center;color:#63716b;padding:20px;font-size:13px}@media(max-width:650px){.fields{grid-template-columns:1fr}.panel{padding:15px}.actions button{flex:1 1 100%}}
</style></head><body><header><div class="wrap"><h1>Pre Test dan Post Test</h1><p>Bahasa Inggris · Kelas VIII · 10 soal pilihan ganda</p><p>Media IFP | Hayat Pramika Bhakti, S.Pd., Gr.</p></div></header><main class="wrap"><section class="panel"><h2>Data peserta</h2><div class="fields"><label>Nama siswa<input id="student" type="text" placeholder="Nama lengkap"></label><label>Kelas<input id="className" type="text" placeholder="Contoh: VIII A"></label><label>Tanggal<input id="date" type="date"></label></div><p class="note">Pilih satu jawaban untuk setiap soal. Hasil akan dinilai otomatis setelah tes dikirim.</p></section><section class="panel"><h2>Soal Tes</h2><form id="quiz"><div id="questions"></div><div class="actions"><button class="primary" type="submit">Kirim dan nilai</button><button class="secondary" id="resetForm" type="button">Kosongkan jawaban</button></div></form><div id="result" class="result" aria-live="polite"></div></section></main><footer>Pre Test dan Post Test · Simple Past Tense</footer>
<script>
const qs=[
["We ___ football in the school yard yesterday.",["play","played","plays","playing"],1],
["My sister ___ a new book last week.",["buy","buys","bought","buying"],2],
["They ___ visit the museum last Sunday.",["do not","did not","does not","were not"],1],
["___ you watch the film last night?",["Do","Does","Did","Are"],2],
["Rina ___ her room two hours ago.",["clean","cleaned","cleans","cleaning"],1],
["We ___ at home yesterday because it rained.",["stay","stays","stayed","staying"],2],
["Choose the correct negative sentence.",["He didn't went to school.","He doesn't go to school yesterday.","He didn't go to school yesterday.","He not go to school yesterday."],2],
["Choose the correct question.",["Did she called you?","Does she call you yesterday?","Did she call you yesterday?","Was she call you yesterday?"],2],
["Which time expression refers to the past?",["tomorrow","next week","every day","last night"],3],
["Doni ___ his grandparents two days ago.",["visits","visited","visit","visiting"],1]
];const $=x=>document.getElementById(x),KEY="simplePastPretestRecords_v1";let started=Date.now();$('date').value=new Date().toLocaleDateString('en-CA');
$('questions').innerHTML=qs.map((q,i)=>`<fieldset class="q"><legend>${i+1}. ${q[0]}</legend><div class="options">${q[1].map((v,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${String.fromCharCode(65+j)}. ${v}</span></label>`).join('')}</div></fieldset>`).join('');

$('quiz').addEventListener('submit',e=>{e.preventDefault();let nama=$('student').value.trim(),kelas=$('className').value.trim(),tanggal=$('date').value;if(!nama||!kelas||!tanggal){alert('Lengkapi nama siswa, kelas, dan tanggal.');return}let ans=qs.map((q,i)=>{let el=document.querySelector(`input[name="q${i}"]:checked`);return el?+el.value:-1}),blank=ans.filter(x=>x<0).length;if(blank&&!confirm(`Ada ${blank} soal belum dijawab. Tetap kirim?`))return;let benar=ans.reduce((s,a,i)=>s+(a===qs[i][2]?1:0),0),skor=benar*10;$('result').style.display='block';$('result').innerHTML=`<div>Hasil tes</div><div class="score">${skor}/100</div><p><b>${benar} dari 10</b> jawaban benar. ${blank?blank+' soal belum dijawab.':''}</p>`;$('result').scrollIntoView({behavior:'smooth',block:'center'})});
$('resetForm').onclick=()=>{if(confirm('Kosongkan semua jawaban?')){$('quiz').reset();$('result').style.display='none';started=Date.now()}};
$('exportCsv').onclick=()=>{let rs=records();if(!rs.length){alert('Belum ada hasil.');return}let heads=['Nama','Kelas','Tanggal','Skor','Jumlah Benar','Durasi',...qs.map((q,i)=>'Jawaban '+(i+1))],rows=rs.map(r=>[r.nama,r.kelas,r.tanggal,r.skor,r.benar,r.durasi,...r.answers]);let csv=[heads,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');saveFile(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'rekap_pretest_simple_past_tense.csv')};
$('exportXlsx').onclick=()=>{let rs=records();if(!rs.length){alert('Belum ada hasil.');return}if(!window.XLSX){alert('File .xlsx membutuhkan koneksi internet untuk memuat pustaka Excel. Silakan gunakan Download CSV (Excel), lalu buka file tersebut di Excel.');return}let data=rs.map(r=>({Nama:r.nama,Kelas:r.kelas,Tanggal:r.tanggal,Skor:r.skor,'Jumlah Benar':r.benar,Durasi:r.durasi,...Object.fromEntries(r.answers.map((a,i)=>['Jawaban '+(i+1),a]))}));let ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rekap Pretest');XLSX.writeFile(wb,'rekap_pretest_simple_past_tense.xlsx')};
$('clearRecords').onclick=()=>{if(confirm('Hapus seluruh rekap dari browser ini? Tidak dapat dibatalkan.')){localStorage.removeItem(KEY);render();$('result').style.display='none'}};render();
</script></body></html>
